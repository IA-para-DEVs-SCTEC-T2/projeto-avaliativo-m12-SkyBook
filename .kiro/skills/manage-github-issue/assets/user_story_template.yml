name: User Story
description: Template para criação de User Stories
title: "[STORY] "
labels: ["story"]
type: Feature

body:
  - type: textarea
    id: description
    attributes:
      label: Descrição da demanda
      description: Breve descrição do que deve ser implementado/atualizado/corrigido.
      placeholder: |
        Como <perfil de usuário>,
        quero <funcionalidade>,
        para <benefício ou objetivo>.
    validations:
      required: true

  - type: textarea
    id: objectives
    attributes:
      label: Objetivo
      description: Lista de objetivos que devem ser realizados no decorrer da demanda.
      placeholder: |
        - Objetivo 1
        - Objetivo 2
        - Objetivo 3
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Escopo
      description: Lista de pontos/trechos/arquivos que a demanda propõe modificar.
      placeholder: |
        - Módulo / camada afetada
        - Arquivo ou componente específico
        - Integrações envolvidas
    validations:
      required: true

  - type: checkboxes
    id: expected-results
    attributes:
      label: Resultado esperado
      description: Checklist de resultados esperados ao final da demanda.
      options:
        - label: Descreva aqui o primeiro resultado esperado
        - label: Descreva aqui o segundo resultado esperado
    validations:
      required: true
