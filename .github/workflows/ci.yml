name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - main

jobs:

  # ─── Backend ───────────────────────────────────────────────────────────────

  backend-build:
    name: '[Backend] Build'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar projeto
        working-directory: backend
        run: ./mvnw package -DskipTests --no-transfer-progress

      - name: Publicar artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-artifact
          path: backend/target/
          retention-days: 1

  backend-test:
    name: '[Backend] Test'
    runs-on: ubuntu-latest
    needs: backend-build

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Baixar artefato de build
        uses: actions/download-artifact@v4
        with:
          name: backend-build-artifact
          path: backend/target/

      - name: Executar testes
        working-directory: backend
        run: ./mvnw test --no-transfer-progress

      - name: Publicar relatório de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          retention-days: 7

  # ─── Frontend ──────────────────────────────────────────────────────────────

  frontend-build:
    name: '[Frontend] Build'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Compilar projeto
        working-directory: frontend
        run: npm run build

      - name: Publicar artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-artifact
          path: frontend/dist/
          retention-days: 1

  frontend-test:
    name: '[Frontend] Test'
    runs-on: ubuntu-latest
    needs: frontend-build

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Executar testes
        working-directory: frontend
        run: npm test

  # ─── Gate ──────────────────────────────────────────────────────────────────

  ci-passed:
    name: 'CI Passed'
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Todos os checks passaram
        run: echo "CI passed for backend and frontend."
