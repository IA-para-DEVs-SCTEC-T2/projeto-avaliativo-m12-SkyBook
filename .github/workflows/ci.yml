name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar projeto
        working-directory: backend
        run: ./mvnw package -DskipTests --no-transfer-progress

      - name: Publicar artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: backend/target/
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Baixar artefato de build
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: backend/target/

      - name: Executar testes
        working-directory: backend
        run: ./mvnw test --no-transfer-progress

      - name: Publicar relatório de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/target/surefire-reports/
          retention-days: 7
